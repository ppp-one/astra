<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FITS File Browser</title>
    <script src="/js/tailwind-3.3.5.js"></script>
    <script src="/js/d3-7.9.0.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <script src="static/js/shared/fileTypes.js"></script>
    <link rel="stylesheet" href="static/js/vendor/simple-fits-viewer/style.css">
    <link rel="stylesheet" href="static/viewer_style.css"> <!-- Link to external CSS file -->
    <link rel="stylesheet" href="static/theme.css"> <!-- Theme variables -->
        <!-- Inline fallback: ensure the explorer root uses theme variables even if external CSS ordering is different -->
</head>
<body class="bg-black/90 text-slate-100 text-sm md:text-base">
    <!-- Header -->
    <div class="bg-neutral-900/80 backdrop-blur-sm border-b border-gray-700/50 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-4">
                    <a href="/" class="text-gray-400 hover:text-white transition-colors" title="Back to Observatory">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                        </svg>
                    </a>
                    <h1 class="text-xl font-bold text-blue-300">FITS File Browser</h1>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto p-6">
        <div class="bg-neutral-900/80 backdrop-blur-sm p-6 rounded-lg border border-gray-700/50 shadow-xl shadow-black/50">
            <!-- Controls -->
            <div class="flex items-center mb-4 flex-wrap gap-2">
                <button id="back-btn" class="p-2 rounded-full bg-gray-600/20 hover:bg-gray-600/40 transition-colors" title="Back to parent folder">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                    </svg>
                </button>
                <select id="sort-select" class="p-2 rounded bg-gray-600/20 hover:bg-gray-600/40 transition-colors text-sm text-slate-100 border border-gray-700/50 cursor-pointer" title="Sort by">
                    <option value="date-desc">Date (Newest)</option>
                    <option value="date-asc">Date (Oldest)</option>
                    <option value="name-asc">Name (A-Z)</option>
                    <option value="name-desc">Name (Z-A)</option>
                </select>
                <button id="zip-folder-btn" type="button" class="p-2 rounded bg-gray-600/20 hover:bg-gray-600/40 transition-colors" title="Download this folder as .zip" aria-label="Download this folder as .zip">
                    <i class="bi bi-file-earmark-zip block w-5 h-5 leading-5 text-center" aria-hidden="true"></i>
                </button>
                <div class="flex-grow min-w-[140px]">
                    <input type="text" id="search" placeholder="Search..." 
                           class="w-full p-2 rounded bg-gray-600/20 text-slate-100 placeholder-gray-400 border border-gray-700/50">
                </div>
            </div>

            <div id="breadcrumbs" class="text-sm text-gray-400 mb-3 whitespace-nowrap overflow-x-auto"></div>
            <ul id="file-list" class="space-y-2 max-h-[60vh] overflow-auto pr-1"></ul>
        </div>
    </div>

    <div id="fits-modal" class="fixed inset-0 items-center justify-center hidden opacity-0 pointer-events-none transition-opacity duration-150" style="z-index: 1000;" aria-hidden="true">
        <div class="absolute inset-0 bg-black/50 backdrop-blur-sm"></div>
        <div class="fe-viewer-dialog" role="dialog" aria-modal="true" aria-label="FITS viewer" tabindex="-1">
            <div class="fe-viewer-top">
                <div id="filePathBanner" class="file-path-banner is-empty" role="status" aria-live="polite" title="No file loaded">No file loaded</div>
                <button id="close-fits-modal" class="toolbar-icon-button" type="button" title="Close (Esc)" aria-label="Close FITS viewer">
                    <i class="bi bi-x-lg" aria-hidden="true"></i>
                </button>
            </div>
            <div id="viewerToolbar" class="viewer-toolbar" role="toolbar" aria-label="Viewer tools">
                <div class="toolbar-group" role="group" aria-label="File">
                    <button id="prev-file-btn" class="toolbar-icon-button" type="button" title="Previous file (Left arrow)" aria-label="Previous file">
                        <i class="bi bi-chevron-left" aria-hidden="true"></i>
                    </button>
                    <button id="next-file-btn" class="toolbar-icon-button" type="button" title="Next file (Right arrow)" aria-label="Next file">
                        <i class="bi bi-chevron-right" aria-hidden="true"></i>
                    </button>
                    <button id="loadFullFitsButton" class="toolbar-icon-button fits-only" type="button" title="Load full resolution (measure stars)" aria-label="Load full resolution">
                        <i class="bi bi-badge-hd" aria-hidden="true"></i>
                    </button>
                    <button id="downloadFitsButton" class="toolbar-icon-button" type="button" title="Download file" aria-label="Download file">
                        <i class="bi bi-download" aria-hidden="true"></i>
                    </button>
                </div>
                <div class="toolbar-group fits-only" role="group" aria-label="Image tools">
                    <button id="stretchButton" class="toolbar-icon-button" type="button" title="Stretch (Z-scale)" aria-label="Stretch">
                        <i class="bi bi-sliders" aria-hidden="true"></i>
                    </button>
                    <button id="histogramButton" class="toolbar-icon-button" type="button" title="Histogram" aria-label="Histogram">
                        <i class="bi bi-bar-chart" aria-hidden="true"></i>
                    </button>
                    <button id="headerButton" class="toolbar-icon-button" type="button" title="Show FITS header" aria-label="FITS header" aria-pressed="false">
                        <i class="bi bi-card-list" aria-hidden="true"></i>
                    </button>
                    <button id="resetZoomButton" class="toolbar-icon-button" type="button" title="Fit image (reset zoom)" aria-label="Reset zoom">
                        <i class="bi bi-arrows-angle-contract" aria-hidden="true"></i>
                    </button>
                </div>
                <label class="hdu-block fits-only" hidden>
                    <span class="hdu-label">HDU</span>
                    <select id="hduSelect" class="control-select" title="Select HDU"></select>
                </label>
                <p class="toolbar-hint fits-only">
                    <span class="hint-mouse">Right-click a star to measure it</span>
                    <span class="hint-touch">Hold a finger on a star to measure it, swipe for next file</span>
                </p>
            </div>
            <div id="fe-stage" class="fe-viewer-stage">
                <div id="fitsViewerRoot"></div>
                <img id="pngImage" alt="PNG preview" hidden>
                <div id="fe-spinner" role="status" aria-label="Loading" hidden></div>
                <div id="fe-message" role="status" aria-live="polite" hidden></div>
            </div>
        </div>
    </div>

    <script>
        (function setAstraFitsBasePath() {
            if (window.__ASTRA_FITS_BASE_PATH) {
                return;
            }
            const { pathname } = window.location;
            if (!pathname) {
                window.__ASTRA_FITS_BASE_PATH = "/";
                return;
            }
            if (pathname.endsWith("/")) {
                window.__ASTRA_FITS_BASE_PATH = pathname;
                return;
            }
            const lastSlash = pathname.lastIndexOf("/");
            window.__ASTRA_FITS_BASE_PATH =
                lastSlash >= 0 ? pathname.slice(0, lastSlash + 1) : "/";
        })();
    </script>
    <script>
        // Listen for theme updates from embedding host and apply as CSS variables
        window.addEventListener('message', (ev) => {
            try {
                const msg = ev.data || {};
                if (msg && msg.type === 'astra-theme' && msg.vars) {
                    const root = document.documentElement;
                    Object.entries(msg.vars).forEach(([k, v]) => {
                        // Expect keys like 'astra-bg' -> set --astra-bg
                        root.style.setProperty(`--${k}`, v);
                    });
                }
            } catch (e) {
                // ignore errors
            }
        }, false);
    </script>
    <script>
        // Notify parent window of our content height so any embedding iframe
        // can be auto-resized. We send messages on load and when the document
        // size changes.
        function postHeight() {
            try {
                const h = document.documentElement.scrollHeight || document.body.scrollHeight;
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ type: 'astra-explorer-height', height: h }, '*');
                }
            } catch (e) {
                // ignore
            }
        }

        window.addEventListener('load', () => {
            postHeight();
            // observe size changes
            if ('ResizeObserver' in window) {
                const ro = new ResizeObserver(() => postHeight());
                ro.observe(document.documentElement);
            } else {
                // fallback: periodic polling
                setInterval(postHeight, 1000);
            }
        });
    </script>
    <script type="module" src="static/js/viewer/index.js"></script>
    <script>
        const BASE_PATH = window.__ASTRA_FITS_BASE_PATH || "/";

        function explorerUrl(relative = "") {
            const base = BASE_PATH.endsWith("/") ? BASE_PATH : `${BASE_PATH}/`;
            
            relative = relative.replace(/%5C/gi, '/'); // replace windows backslashes with forward slashes

            const trimmed = relative.startsWith("/")
                ? relative.slice(1)
                : relative;
            return base === "/" ? `/${trimmed}` : `${base}${trimmed}`;
        }

        function encodePathForQuery(path) {
            return path
                .split("/")
                .map((segment) => encodeURIComponent(segment))
                .join("/");
        }

        let currentPath = "";
        function isSupportedPreviewFile(name) {
            return !!window.__astraFileTypes?.isSupportedPreviewFile?.(name);
        }

        async function fetchFiles(path = "") {
            const query = path ? `?path=${encodePathForQuery(path)}` : "";
            const response = await fetch(explorerUrl(`list/${query}`));
            const data = await response.json();

            if (data.error) {
                alert(data.error);
                return;
            }

            currentPath = data.current_path;
            window.__fe_last_files = data.files || [];

            updateBreadcrumbs(data.breadcrumbs);
            renderFileList();

            // if modal open, refresh prev/next state
            const modal = document.getElementById('fits-modal');
            if (modal && modal.classList.contains('flex') && !modal.classList.contains('hidden') && window.__fe_current_file) {
                updatePrevNextState(window.__fe_current_file);
            }
        }

        // Initialize sort mode to date-desc (newest first)
        window.__fe_sort_mode = window.__fe_sort_mode || 'date-desc';
        
        function applySorting(files, mode) {
            const sorted = files.slice();
            switch (mode) {
                case 'date-desc': // Newest first
                    sorted.sort((a, b) => (b.mtime || 0) - (a.mtime || 0));
                    break;
                case 'date-asc': // Oldest first
                    sorted.sort((a, b) => (a.mtime || 0) - (b.mtime || 0));
                    break;
                case 'name-asc': // A-Z
                    sorted.sort((a, b) => a.name.toLowerCase().localeCompare(b.name.toLowerCase()));
                    break;
                case 'name-desc': // Z-A
                    sorted.sort((a, b) => b.name.toLowerCase().localeCompare(a.name.toLowerCase()));
                    break;
            }
            return sorted;
        }
        
        function renderFileList() {
            const files = applySorting(window.__fe_last_files || [], window.__fe_sort_mode);
            const fileList = document.getElementById('file-list');
            // Build off-DOM and insert once, so large folders cause one update
            const fragment = document.createDocumentFragment();

            files.forEach(file => {
                const item = document.createElement('li');
                item.title = file.name;
                item.classList.add(
                    'group', 'p-2', 'rounded', 'cursor-pointer', 'flex', 'items-center', 'gap-2', 'w-full',
                    'text-slate-100', 'hover:bg-gray-600/40', 'transition-colors'
                );
                const name = document.createElement('span');
                name.textContent = file.name;
                name.classList.add('truncate', 'flex-1', 'min-w-0');
                item.appendChild(name);

                if (file.is_dir) {
                    item.onclick = () => fetchFiles(file.path);
                    const zipButton = document.createElement('button');
                    zipButton.type = 'button';
                    zipButton.title = `Download ${file.name} as .zip`;
                    zipButton.setAttribute('aria-label', zipButton.title);
                    zipButton.className = 'shrink-0 px-1 text-gray-400 hover:text-white opacity-60 group-hover:opacity-100 focus:opacity-100';
                    zipButton.innerHTML = '<i class="bi bi-file-earmark-zip" aria-hidden="true"></i>';
                    zipButton.onclick = (event) => {
                        event.stopPropagation();
                        downloadFolderZip(file.path);
                    };
                    item.appendChild(zipButton);
                } else if (isSupportedPreviewFile(file.name)) {
                    item.onclick = () => openFitsModal(file.path);
                } else {
                    item.onclick = () => alert(`Selected: ${file.path}`);
                }
                fragment.appendChild(item);
            });
            fileList.replaceChildren(fragment);

            // refresh prev/next state if modal open
            const modal = document.getElementById('fits-modal');
            if (modal && modal.classList.contains('is-visible') && window.__fe_current_file) {
                updatePrevNextState(window.__fe_current_file);
            }
        }

        // Sort dropdown: handle sorting mode changes
        const sortSelect = document.getElementById('sort-select');
        sortSelect.value = window.__fe_sort_mode;
        sortSelect.addEventListener('change', function () {
            window.__fe_sort_mode = this.value;
            renderFileList();
        });

        // Files the viewer can step through, in list order (folders are skipped)
        function viewableFiles() {
            return applySorting(window.__fe_last_files || [], window.__fe_sort_mode)
                .filter(f => !f.is_dir && isSupportedPreviewFile(f.name));
        }

        function updatePrevNextState(filePath) {
            const files = viewableFiles();
            const idx = files.findIndex(f => f.path === filePath);
            document.getElementById('prev-file-btn').disabled = idx <= 0;
            document.getElementById('next-file-btn').disabled = idx === -1 || idx >= files.length - 1;
        }

        // Previous/Next navigation for FITS modal
        function navigateToOffset(offset) {
            const files = viewableFiles();
            const idx = files.findIndex(f => f.path === (window.__fe_current_file || ''));
            const target = idx === -1 ? null : files[idx + offset];
            if (target) {
                openFitsModal(target.path);
            }
        }

        document.getElementById('prev-file-btn').addEventListener('click', () => navigateToOffset(-1));
        document.getElementById('next-file-btn').addEventListener('click', () => navigateToOffset(1));

        function updateBreadcrumbs(breadcrumbs) {
            const breadcrumbContainer = document.getElementById("breadcrumbs");

            // Home icon always shown as the first clickable element
            const homeHtml = `<span class="cursor-pointer hover:underline" title="Root" onclick="fetchFiles('')"><i class="bi bi-house" aria-hidden="true"></i></span>`;

            if (!breadcrumbs || breadcrumbs.length === 0) {
                breadcrumbContainer.innerHTML = homeHtml;
                return;
            }

            const parts = breadcrumbs || [];
            const mapped = parts.map((part, index) => {
                const path = parts.slice(0, index + 1).join('/');
                return `<span class="cursor-pointer hover:underline" onclick="fetchFiles('${path}')">${part}</span>`;
            });

            breadcrumbContainer.innerHTML = [homeHtml].concat(mapped).join(" <span aria-hidden=\"true\" class='text-gray-500'>/</span> ");
        }

        document.getElementById("search").addEventListener("input", function () {
            const query = this.value.toLowerCase();
            document.querySelectorAll("#file-list li").forEach(item => {
                item.style.display = item.textContent.toLowerCase().includes(query) ? "" : "none";
            });
        });

        document.getElementById("back-btn").addEventListener("click", function () {
            if (currentPath) {
                const parentPath = currentPath.split("/").slice(0, -1).join("/");
                fetchFiles(parentPath);
            }
        });

        // Modal logic
        function openFitsModal(filePath) {
            const modal = document.getElementById('fits-modal');
            if (!modal) return;
            window.__fe_current_file = filePath;
            document.body.style.overflow = 'hidden';
            modal.classList.remove('hidden', 'opacity-0', 'pointer-events-none');
            modal.classList.add('flex', 'opacity-100', 'pointer-events-auto');
            modal.setAttribute('aria-hidden', 'false');
            updatePrevNextState(filePath);
            modal.querySelector('[role="dialog"]')?.focus({ preventScroll: true });

            if (typeof window.openViewerFile !== 'function') {
                console.warn('Viewer module is still initializing; please retry in a moment.');
                return;
            }
            window.openViewerFile(filePath).catch(() => {
                /* the viewer module reports errors */
            });
        }

        function closeFitsModal() {
            const modal = document.getElementById('fits-modal');
            if (!modal) return;
            modal.classList.remove('opacity-100', 'pointer-events-auto');
            modal.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                modal.classList.remove('flex');
                modal.classList.add('hidden');
            }, 150);
            modal.setAttribute('aria-hidden', 'true');
            document.body.style.overflow = '';
            if (typeof window.cancelViewerLoads === 'function') {
                window.cancelViewerLoads();
            }
        }
        document.getElementById('close-fits-modal').onclick = closeFitsModal;
        // Click on backdrop (first child div with bg-black/50) to close
        document.getElementById('fits-modal').addEventListener('click', function(e) {
            // Close only for clicks on the backdrop itself. (Testing "outside the
            // dialog" fails when a click handler replaces the clicked element.)
            if (e.target === this || e.target === this.firstElementChild) {
                closeFitsModal();
            }
        });

        function triggerDownload(url, filename = '') {
            const link = document.createElement('a');
            link.href = url;
            link.download = filename; // empty: use the server's filename
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Download FITS file button handler
        document.getElementById('downloadFitsButton').addEventListener('click', function() {
            if (!window.__fe_current_file) return;
            const downloadUrl = explorerUrl(`download/${encodePathForQuery(window.__fe_current_file)}`);
            triggerDownload(downloadUrl, window.__fe_current_file.split('/').pop());
        });

        // The server streams the zip, so the download starts at once
        function downloadFolderZip(path) {
            const query = path ? `?path=${encodePathForQuery(path)}` : "";
            triggerDownload(explorerUrl(`download_zip/${query}`));
        }
        document.getElementById('zip-folder-btn').addEventListener('click', () => downloadFolderZip(currentPath));


        document.addEventListener('keydown', function(event) {
            const modal = document.getElementById('fits-modal');
            const modalOpen = modal && modal.classList.contains('flex') && !modal.classList.contains('hidden');
            // Keys typed into a field (e.g. the header search) are not shortcuts
            if (event.target.closest?.('input, textarea, select')) return;

            if (event.key === 'Escape') {
                // Close the modal if it's open
                if (modalOpen) {
                    closeFitsModal();
                }
                // Move back one directory if the modal is not open
                else if (currentPath) {
                    const parentPath = currentPath.split("/").slice(0, -1).join("/");
                    fetchFiles(parentPath);
                }
            }

            // Keyboard navigation when modal is open: Left/Right arrows for prev/next
            if (modalOpen) {
                if (event.key === 'ArrowLeft') {
                    event.preventDefault();
                    navigateToOffset(-1);
                } else if (event.key === 'ArrowRight') {
                    event.preventDefault();
                    navigateToOffset(1);
                }
            }
        });


        fetchFiles('');
    </script>
</body>
</html>
